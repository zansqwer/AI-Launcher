<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Command Launcher</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Hint text for activation -->
    <div class="activation-hint">
        <span class="hint-key">Ctrl</span> + <span class="hint-key">Space</span> to launch
    </div>

    <div class="launcher-container">
        <!-- Main launcher interface -->
        <div class="launcher">
            <!-- Search input section -->
            <div class="input-section">
                <div class="input-container">
                    <i class="fas fa-search input-icon"></i>
                    <input
                        type="text"
                        id="command-input"
                        placeholder="Type a command or ask anything..."
                        class="command-input"
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <div class="input-actions">
                        <button class="action-btn mic-btn" aria-label="Voice input" title="Voice input">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <button class="action-btn settings-btn" aria-label="Settings" title="Settings">
                            <i class="fas fa-cog"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Command suggestions/quick actions -->
            <div class="suggestions-section">
                <div class="section-header">
                    <i class="fas fa-bolt"></i>
                    <span>Quick Actions</span>
                </div>
                <div class="suggestions-grid">
                    <button class="suggestion-card" data-command="analyze">
                        <div class="card-icon">
                            <i class="fas fa-brain"></i>
                        </div>
                        <div class="card-content">
                            <div class="card-title">AI Analyze</div>
                            <div class="card-desc">Analyze context</div>
                        </div>
                    </button>
                    <button class="suggestion-card" data-command="search">
                        <div class="card-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <div class="card-content">
                            <div class="card-title">Smart Search</div>
                            <div class="card-desc">Find anything</div>
                        </div>
                    </button>
                    <button class="suggestion-card" data-command="generate">
                        <div class="card-icon">
                            <i class="fas fa-magic"></i>
                        </div>
                        <div class="card-content">
                            <div class="card-title">Generate</div>
                            <div class="card-desc">Create content</div>
                        </div>
                    </button>
                    <button class="suggestion-card" data-command="assistant">
                        <div class="card-icon">
                            <i class="fas fa-robot"></i>
                        </div>
                        <div class="card-content">
                            <div class="card-title">AI Assistant</div>
                            <div class="card-desc">Get help</div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Recent commands section -->
            <div class="recent-section">
                <div class="section-header">
                    <i class="fas fa-history"></i>
                    <span>Recent</span>
                </div>
                <div class="recent-items" id="recent-items">
                    <!-- Recent items will be populated here -->
                    <div class="empty-state">
                        <i class="fas fa-clock"></i>
                        <span>No recent commands</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Chat interface -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-title">
                    <i class="fas fa-comments"></i>
                    <span>AI Assistant</span>
                </div>
                <button class="close-btn" aria-label="Close chat">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="chat-content">
                <div class="chat-messages" id="chat-messages">
                    <!-- Messages will be added here -->
                </div>
                <div class="typing-indicator">
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span class="typing-text">AI is thinking...</span>
                </div>
            </div>
        </div>

        <!-- Keyboard shortcuts hint -->
        <div class="shortcuts-hint">
            <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
            <span><kbd>Enter</kbd> Select</span>
            <span><kbd>Esc</kbd> Close</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
